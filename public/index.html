<!doctype html>
<html lang="fa" dir="rtl">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>دیزاینر هنری هوشمند</title>

<style>

body{
font-family:Tahoma,Arial;
background:#f5edef;
color:#473c3f;
margin:0
}

main{
max-width:720px;
margin:auto;
padding:20px
}

.card{
background:#fff;
border-radius:26px;
padding:22px;
box-shadow:0 8px 30px #0001
}

.field{
margin:15px 0
}

label{
display:block;
font-weight:700;
margin-bottom:7px
}

input,select,textarea,button{

width:100%;
box-sizing:border-box;
padding:13px;
border:1px solid #ddd;
border-radius:15px;
font-size:16px

}

textarea{
min-height:85px
}

button{

background:#584449;
color:white;
font-weight:700;
cursor:pointer

}

button:disabled{
opacity:.6
}

.status{

margin-top:14px;
padding:12px;
border-radius:14px;
background:#f6eef0

}

.track{

height:11px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin-top:10px

}

.bar{

height:100%;
width:0;
background:#ad8792;
transition:width .4s

}

#result{

display:none;
width:100%;
margin-top:15px;
border-radius:18px

}

.download{

display:none;
text-align:center;
margin-top:12px;
padding:13px;
border-radius:15px;
background:#70545c;
color:white;
text-decoration:none;
font-weight:700

}

</style>

</head>


<body>


<main>

<div class="card">


<h1>🎨 دیزاینر هنری هوشمند</h1>

<p>
عکس اثر هنری را بدهید؛ محیط مناسب را برای یک پوستر تبلیغاتی حرفه‌ای می‌سازد.
</p>



<div class="field">

<label>
عکس اثر
</label>

<input 
id="image"
type="file"
accept="image/jpeg,image/png,image/webp">

</div>




<div class="field">

<label>
نوع محصول
</label>

<select id="type">

<option>تابلو</option>
<option>گلدان</option>
<option>جاشمعی</option>
<option>ست رومیزی</option>
<option>سایر آثار هنری</option>

</select>

</div>




<div class="field">

<label>
سبک
</label>

<select id="style">

<option>
انتخاب هوشمند توسط نرم‌افزار ✨
</option>

<option>
مدرن و مینیمال
</option>

<option>
کلاسیک و لوکس
</option>

<option>
گرم و هنری
</option>

<option>
بوهو و طبیعی
</option>

</select>

</div>




<div class="field">

<label>
توضیح اختیاری
</label>

<textarea 
id="extra"
placeholder="مثلاً دیوار کرم، نشیمن روشن، دکور خلوت...">
</textarea>

</div>




<button id="go">
ساخت تصویر با هوش مصنوعی ✨
</button>



<div 
id="status"
class="status"
style="display:none">
</div>


<div class="track">

<div id="bar" class="bar"></div>

</div>



<img id="result">


<a 
id="download"
class="download">
⬇️ دانلود تصویر نهایی
</a>



</div>

</main>





<script>


const $ = x => document.getElementById(x);



$("go").onclick = async ()=>{


const f = $("image").files[0];



if(!f){

$("status").style.display="block";

$("status").textContent=
"لطفاً عکس را انتخاب کنید.";

return;

}



$("go").disabled=true;


$("result").style.display="none";

$("download").style.display="none";


$("status").style.display="block";

$("status").textContent=
"در حال آماده‌سازی...";


$("bar").style.width="15%";



try{


const buffer = await f.arrayBuffer();

let mime = f.type;

if (!mime || !mime.startsWith("image/")) {
  const ext = f.name.split(".").pop().toLowerCase();

  if (ext === "png") {
    mime = "image/png";
  } else if (ext === "webp") {
    mime = "image/webp";
  } else {
    mime = "image/jpeg";
  }
}

const fixedFile = new File(
  [buffer],
  f.name,
  { type: mime }
);



const fd = new FormData();



fd.append(
"image",
fixedFile,
f.name
);



fd.append(
"type",
$("type").value
);



fd.append(
"style",
$("style").value
);



fd.append(
"extra",
$("extra").value
);



$("status").textContent=
"در حال ساخت تصویر...";


$("bar").style.width="50%";



const r = await fetch(

"/api/generate",

{

method:"POST",

body:fd

}

);



const d = await r.json();



if(!r.ok){

throw new Error(
d.error || "خطای سرور"
);

}



$("bar").style.width="100%";

$("status").textContent=
"تصویر با موفقیت ساخته شد.";



$("result").src=d.image;

$("result").style.display="block";



$("download").href=d.image;

$("download").download=
d.downloadName ||
"art-designer-result.png";


$("download").style.display="block";



}

catch(e){


$("bar").style.width="100%";


$("status").textContent=
"خطا: "+e.message;


}


finally{


$("go").disabled=false;


}



};



</script>


</body>

</html>
