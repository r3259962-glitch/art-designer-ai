<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c9a77b">
<title>پیشی 🐾</title>
<style>
:root{--ink:#352a25;--soft:#fff8ef;--wood:#b98c62;--green:#7b9b73;--night:#182230}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#17130f;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;background:linear-gradient(#eadbc7,#b78e68)}
.top{position:absolute;z-index:5;top:10px;right:10px;left:10px;display:flex;gap:7px;justify-content:space-between;align-items:center}
.pill{background:#ffffffe8;border:1px solid #ffffff80;border-radius:999px;padding:7px 11px;font-size:12px;backdrop-filter:blur(8px)}
.stats{display:flex;gap:5px}
.stat{min-width:60px;text-align:center}
.bar{height:5px;background:#eadfd5;border-radius:9px;overflow:hidden;margin-top:3px}.fill{height:100%;width:50%;background:#789b70;transition:width .4s}
.scene{position:relative;flex:1;overflow:hidden;touch-action:none;user-select:none}
.wall{position:absolute;inset:0 0 35% 0;background:linear-gradient(145deg,#eee0ca,#d6c1a5)}
.floor{position:absolute;inset:65% 0 0;background:repeating-linear-gradient(90deg,#b8895e 0 42px,#ad7d54 42px 45px)}
.window{position:absolute;top:10%;left:7%;width:31%;height:27%;border:10px solid #76583f;border-radius:8px;background:linear-gradient(#8cc5e8,#d9f2ff 58%,#a9c77f 59%,#78965e);box-shadow:0 7px 16px #0002}
.sun{position:absolute;width:30px;height:30px;border-radius:50%;background:#ffe8a0;top:16%;right:15%}
.rug{position:absolute;left:10%;right:10%;bottom:7%;height:23%;border-radius:50%;background:#d8b995aa;box-shadow:inset 0 0 0 3px #b9926d55}
.box,.bed,.bowl,.scratch{position:absolute;z-index:2}
.box{right:7%;bottom:14%;width:25%;height:18%;background:#9c7048;border-radius:8px 8px 4px 4px;box-shadow:inset 0 10px #b4875b}
.box:after{content:"";position:absolute;right:25%;bottom:0;width:50%;height:55%;background:#2f2520;border-radius:50% 50% 0 0}
.bed{left:8%;bottom:16%;width:27%;height:12%;border-radius:50%;background:#b7a0ba;border:7px solid #8f7894}
.bowl{right:38%;bottom:12%;width:58px;height:25px;border-radius:0 0 25px 25px;background:#f0f0eb;border:2px solid #9b9b95}
.scratch{left:39%;bottom:22%;width:10px;height:85px;background:#a27a55;border-radius:7px;box-shadow:0 0 0 5px #cfab82}
.catWrap{position:absolute;z-index:3;left:50%;top:52%;width:220px;height:180px;transform:translate(-50%,-50%);transition:transform .8s ease}
.cat{position:absolute;inset:0;filter:drop-shadow(0 10px 8px #0003)}
.body{position:absolute;width:132px;height:83px;border-radius:48% 50% 43% 43%;left:45px;top:72px;background:linear-gradient(150deg,#e8b87c,#b97643);box-shadow:inset -9px -10px 0 #9d613b44}
.head{position:absolute;width:91px;height:78px;border-radius:48% 48% 45% 45%;left:72px;top:23px;background:linear-gradient(150deg,#efc38b,#bd7d48);z-index:3}
.ear{position:absolute;top:9px;width:36px;height:40px;background:#bd7d48;clip-path:polygon(50% 0,100% 100%,0 100%);z-index:2}.ear:after{content:"";position:absolute;inset:10px 10px 4px;background:#e79aa1;clip-path:inherit}
.e1{left:76px;transform:rotate(-13deg)}.e2{left:126px;transform:rotate(13deg)}
.eye{position:absolute;top:52px;width:10px;height:13px;border-radius:50%;background:#241d1a;z-index:5;transition:.25s}.eye:after{content:"";position:absolute;left:4px;top:1px;width:3px;height:4px;border-radius:50%;background:white}.eye1{left:94px}.eye2{left:131px}
.nose{position:absolute;z-index:6;left:116px;top:68px;width:9px;height:7px;background:#8e4f54;border-radius:55% 55% 60% 60%;transform:rotate(180deg)}
.whisk{position:absolute;z-index:6;width:46px;height:1px;background:#fff9;top:72px}.w1{left:48px;transform:rotate(9deg)}.w2{left:46px;top:79px;transform:rotate(-4deg)}.w3{left:143px;transform:rotate(-9deg)}.w4{left:144px;top:79px;transform:rotate(4deg)}
.tail{position:absolute;z-index:1;left:32px;top:75px;width:74px;height:58px;border:14px solid #b97643;border-right:0;border-bottom:0;border-radius:60px 0 0 0;transform:rotate(-24deg);transform-origin:right bottom;transition:.5s}
.paw{position:absolute;z-index:4;width:30px;height:18px;border-radius:50%;background:#c6814b;top:137px}.p1{left:69px}.p2{left:141px}
.purr{animation:purr .35s infinite alternate}.happy .head{transform:translateY(-3px)}.blink .eye{height:2px;top:57px}.annoyed .tail{transform:rotate(30deg) scaleY(1.1)}.sleepy .eye{height:2px;top:58px}
@keyframes purr{to{transform:scale(1.015)}}
.chat{position:absolute;z-index:8;left:10px;right:10px;bottom:10px;display:flex;gap:7px}
.chat input{flex:1;border:0;border-radius:18px;padding:12px 14px;background:#fffffff2;font-size:14px;outline:0}
.chat button{border:0;border-radius:18px;padding:0 15px;background:#45372e;color:white;font-size:14px}
.bubble{position:absolute;z-index:9;left:50%;top:15%;transform:translateX(-50%);max-width:80%;padding:9px 13px;border-radius:17px;background:#fffdf8;box-shadow:0 5px 20px #0002;font-size:13px;opacity:0;pointer-events:none;transition:.25s}.bubble.show{opacity:1}
.hint{position:absolute;z-index:6;left:50%;bottom:18%;transform:translateX(-50%);font-size:11px;color:#fff;background:#0005;padding:5px 9px;border-radius:10px;white-space:nowrap;opacity:.8}
@media(max-height:620px){.window{height:23%}.catWrap{top:49%;transform:translate(-50%,-50%) scale(.84)}.chat{bottom:6px}.hint{bottom:15%}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="pill">🐾 پیشی</div>
    <div class="stats">
      <div class="pill stat">🍗<span id="hunger">80</span><div class="bar"><div class="fill" id="hf"></div></div></div>
      <div class="pill stat">⚡<span id="energy">80</span><div class="bar"><div class="fill" id="ef"></div></div></div>
      <div class="pill stat">❤️<span id="happy">70</span><div class="bar"><div class="fill" id="yf"></div></div></div>
      <div class="pill stat">🤍<span id="trust">45</span><div class="bar"><div class="fill" id="tf"></div></div></div>
    </div>
  </div>
  <div class="scene" id="scene">
    <div class="wall"></div><div class="floor"></div><div class="window"><div class="sun"></div></div>
    <div class="rug"></div><div class="bed"></div><div class="box"></div><div class="bowl"></div><div class="scratch"></div>
    <div class="bubble" id="bubble"></div>
    <div class="catWrap" id="catWrap">
      <div class="cat" id="cat">
        <div class="tail"></div><div class="body"></div>
        <div class="ear e1"></div><div class="ear e2"></div><div class="head"></div>
        <div class="eye eye1"></div><div class="eye eye2"></div><div class="nose"></div>
        <div class="whisk w1"></div><div class="whisk w2"></div><div class="whisk w3"></div><div class="whisk w4"></div>
        <div class="paw p1"></div><div class="paw p2"></div>
      </div>
    </div>
    <div class="hint">انگشتت را روی پیشی بکش 🐾</div>
  </div>
  <div class="chat"><input id="msg" placeholder="با پیشی حرف بزن..." autocomplete="off"><button id="send">ارسال</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const defaults={hunger:80,energy:80,happy:70,trust:45,lastSeen:Date.now(),memory:[],petLoad:0};
let s=JSON.parse(localStorage.getItem("pishi-state")||"null")||defaults;
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
function catchUp(){
  const hrs=Math.max(0,(Date.now()-s.lastSeen)/36e5);
  s.hunger=clamp(s.hunger-hrs*2.4);
  s.energy=clamp(s.energy-(hrs>7?1.8:0.35));
  s.happy=clamp(s.happy-hrs*.75);
  if(hrs>48)s.happy=clamp(s.happy-8);
  if(hrs>1440){s.happy=clamp(s.happy-10);s.energy=clamp(s.energy-7)}
  s.lastSeen=Date.now();
}
catchUp();
function save(){s.lastSeen=Date.now();localStorage.setItem("pishi-state",JSON.stringify(s))}
function render(){
  ["hunger","energy","happy","trust"].forEach(k=>$(k).textContent=Math.round(s[k]));
  $("hf").style.width=s.hunger+"%";$("ef").style.width=s.energy+"%";$("yf").style.width=s.happy+"%";$("tf").style.width=s.trust+"%";
}
function say(t,ms=2500){$("bubble").textContent=t;$("bubble").classList.add("show");clearTimeout(say.t);say.t=setTimeout(()=>$("bubble").classList.remove("show"),ms)}
function mood(){
  $("cat").className="cat";
  if(s.energy<25)$("cat").classList.add("sleepy");
  else if(s.petLoad>75)$("cat").classList.add("annoyed");
  else if(s.happy>75)$("cat").classList.add("happy");
}
function react(type){
  if(type==="pet"){
    if(s.petLoad>80){s.petLoad=0;s.happy=clamp(s.happy-2);say("دیگه بسه... 😾"); $("cat").classList.add("annoyed"); return}
    const gain=s.trust>60?2:1;
    s.happy=clamp(s.happy+gain);s.trust=clamp(s.trust+(Math.random()<.45?.3:0));s.petLoad+=12;
    $("cat").classList.add("purr");say(s.petLoad>55?"خرررر... 🐱":"آخ... خوبه 🥰");
  } else if(type==="head"){s.trust=clamp(s.trust+.5);s.happy=clamp(s.happy+1);say("سرم رو دوست داری؟ 😽")}
  else if(type==="ear"){say(s.trust>55?"آروم گوشم... 🐱":"هی! گوشم! 😾");if(s.trust<40)s.happy=clamp(s.happy-1)}
  else if(type==="belly"){if(s.trust<70){say("نه نه... شکمم نه! 😾");s.happy=clamp(s.happy-2)}else{say("فقط یه کوچولو... 🥹");s.happy=clamp(s.happy+1)}}
  else if(type==="tail"){say("دمم رو ول کن! 😾");s.happy=clamp(s.happy-1)}
  mood();render();save();
}
let down=null;
$("scene").addEventListener("pointerdown",e=>{const r=$("catWrap").getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){down={x:e.clientX,y:e.clientY,t:Date.now()};}});
$("scene").addEventListener("pointerup",e=>{
 if(!down)return;const r=$("catWrap").getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
 const dx=e.clientX-down.x,dy=e.clientY-down.y,dist=Math.hypot(dx,dy);
 let type;
 if(y<55) type="head"; else if(y<30) type="ear"; else if(y>115&&x<85) type="tail"; else if(y>105&&x>70&&x<155) type="belly"; else type="pet";
 if(dist>10)type="pet";
 react(type);down=null;
});
$("scene").addEventListener("pointercancel",()=>down=null);

async function chat(){
 const input=$("msg"),message=input.value.trim();if(!message)return;
 input.value="";say("دارم بهت فکر می‌کنم... 🐱",5000);
 s.memory.push({role:"user",content:message});s.memory=s.memory.slice(-12);
 try{
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,state:{hunger:s.hunger,energy:s.energy,happy:s.happy,trust:s.trust},memory:s.memory})});
  const data=await r.json();
  if(!r.ok)throw new Error(data.error||"chat");
  say(data.reply,5000);s.memory.push({role:"assistant",content:data.reply});s.memory=s.memory.slice(-12);save();
 }catch(e){say("میو... فعلاً صدای من از اینجا رد نمی‌شه 😿");}
}
$("send").onclick=chat;$("msg").addEventListener("keydown",e=>{if(e.key==="Enter")chat()});

setInterval(()=>{
 s.hunger=clamp(s.hunger-.035);s.energy=clamp(s.energy-(s.energy<30?-.02:.012));s.happy=clamp(s.happy-(s.hunger<25?.018:.006));
 if(s.petLoad>0)s.petLoad=Math.max(0,s.petLoad-.8);
 mood();render();save();
},1000);

let idle=0;
setInterval(()=>{
 idle++;
 const choices=s.hunger<30?["میو... گرسنه‌ام 😿","سمت ظرف غذا می‌روم..."]:s.energy<25?["چرت می‌زنم... 😴","امروز خیلی خوابم میاد"]:["*به پنجره خیره می‌شود* 🐱","*خودش را تمیز می‌کند*","*می‌رود داخل جعبه* 📦","*چند قدم آرام راه می‌رود*"];
 if(Math.random()<.5)say(choices[Math.floor(Math.random()*choices.length)]);
},10000);
render();mood();
</script>
</body>
</html>
