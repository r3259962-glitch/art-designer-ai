<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c9a77b">
<title>پیشی 🐾</title>
<style>
:root{--ink:#352a25;--soft:#fff8ef;--wood:#b98c62;--green:#7b9b73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#17130f;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;background:linear-gradient(#eadbc7,#b78e68)}
.top{position:absolute;z-index:10;top:10px;right:10px;left:10px;display:flex;gap:7px;justify-content:space-between;align-items:center}
.pill{background:#ffffffe8;border:1px solid #ffffff80;border-radius:999px;padding:7px 11px;font-size:12px;backdrop-filter:blur(8px)}
.stats{display:flex;gap:5px}.stat{min-width:57px;text-align:center}
.bar{height:5px;background:#eadfd5;border-radius:9px;overflow:hidden;margin-top:3px}.fill{height:100%;width:50%;background:#789b70;transition:width .4s}
.scene{position:relative;flex:1;overflow:hidden;touch-action:none;user-select:none}
.wall{position:absolute;inset:0 0 35% 0;background:linear-gradient(145deg,#eee0ca,#d6c1a5)}
.floor{position:absolute;inset:65% 0 0;background:repeating-linear-gradient(90deg,#b8895e 0 42px,#ad7d54 42px 45px)}
.window{position:absolute;top:10%;left:7%;width:31%;height:27%;border:10px solid #76583f;border-radius:8px;background:linear-gradient(#8cc5e8,#d9f2ff 58%,#a9c77f 59%,#78965e);box-shadow:0 7px 16px #0002}
.sun{position:absolute;width:30px;height:30px;border-radius:50%;background:#ffe8a0;top:16%;right:15%}
.rug{position:absolute;left:10%;right:10%;bottom:7%;height:23%;border-radius:50%;background:#d8b995aa;box-shadow:inset 0 0 0 3px #b9926d55}
.box,.bed,.bowl,.scratch,.toy{position:absolute;z-index:2}
.box{right:7%;bottom:14%;width:25%;height:18%;background:#9c7048;border-radius:8px 8px 4px 4px;box-shadow:inset 0 10px #b4875b}
.box:after{content:"";position:absolute;right:25%;bottom:0;width:50%;height:55%;background:#2f2520;border-radius:50% 50% 0 0}
.bed{left:8%;bottom:16%;width:27%;height:12%;border-radius:50%;background:#b7a0ba;border:7px solid #8f7894}
.bowl{right:38%;bottom:12%;width:58px;height:25px;border-radius:0 0 25px 25px;background:#f0f0eb;border:2px solid #9b9b95}
.scratch{left:39%;bottom:22%;width:10px;height:85px;background:#a27a55;border-radius:7px;box-shadow:0 0 0 5px #cfab82}
.toy{left:53%;bottom:16%;width:22px;height:22px;border-radius:50%;background:#d98c70;box-shadow:18px -9px 0 -7px #f0d27d}
.catWrap{position:absolute;z-index:4;left:50%;top:52%;width:220px;height:180px;transform:translate(-50%,-50%);transition:left 1.1s ease,top 1.1s ease,transform .5s ease}
.cat{position:absolute;inset:0;filter:drop-shadow(0 10px 8px #0003)}
.body{position:absolute;width:132px;height:83px;border-radius:48% 50% 43% 43%;left:45px;top:72px;background:linear-gradient(150deg,#e8b87c,#b97643);box-shadow:inset -9px -10px 0 #9d613b44;transition:.35s}
.head{position:absolute;width:91px;height:78px;border-radius:48% 48% 45% 45%;left:72px;top:23px;background:linear-gradient(150deg,#efc38b,#bd7d48);z-index:3;transition:.3s}
.ear{position:absolute;top:9px;width:36px;height:40px;background:#bd7d48;clip-path:polygon(50% 0,100% 100%,0 100%);z-index:2;transition:.25s}
.ear:after{content:"";position:absolute;inset:10px 10px 4px;background:#e79aa1;clip-path:inherit}
.e1{left:76px;transform:rotate(-13deg)}.e2{left:126px;transform:rotate(13deg)}
.eye{position:absolute;top:52px;width:10px;height:13px;border-radius:50%;background:#241d1a;z-index:5;transition:.25s}.eye:after{content:"";position:absolute;left:4px;top:1px;width:3px;height:4px;border-radius:50%;background:white}.eye1{left:94px}.eye2{left:131px}
.nose{position:absolute;z-index:6;left:116px;top:68px;width:9px;height:7px;background:#8e4f54;border-radius:55%;transform:rotate(180deg)}
.whisk{position:absolute;z-index:6;width:46px;height:1px;background:#fff9;top:72px}.w1{left:48px;transform:rotate(9deg)}.w2{left:46px;top:79px;transform:rotate(-4deg)}.w3{left:143px;transform:rotate(-9deg)}.w4{left:144px;top:79px;transform:rotate(4deg)}
.tail{position:absolute;z-index:1;left:32px;top:75px;width:74px;height:58px;border:14px solid #b97643;border-right:0;border-bottom:0;border-radius:60px 0 0 0;transform:rotate(-24deg);transform-origin:right bottom;transition:.5s}
.paw{position:absolute;z-index:4;width:30px;height:18px;border-radius:50%;background:#c6814b;top:137px;transition:.3s}.p1{left:69px}.p2{left:141px}
.purr{animation:purr .35s infinite alternate}.happy .head{transform:translateY(-3px)}.blink .eye{height:2px;top:57px}.annoyed .tail{transform:rotate(30deg) scaleY(1.1)}.sleepy .eye{height:2px;top:58px}.alert .ear{transform:translateY(-4px) rotate(-8deg)}.alert .e2{transform:translateY(-4px) rotate(8deg)}
.walk .body{animation:walk .28s infinite alternate}.walk .p1{transform:translateY(3px)}.walk .p2{transform:translateY(-3px)}
.sleep .body{transform:scale(.98, .9) translateY(8px)}.sleep .head{transform:translateY(10px) rotate(4deg)}.sleep .tail{transform:rotate(-5deg)}
@keyframes purr{to{transform:scale(1.015)}}@keyframes walk{to{transform:translateY(2px)}}
.bubble{position:absolute;z-index:9;left:50%;top:15%;transform:translateX(-50%);max-width:82%;padding:9px 13px;border-radius:17px;background:#fffdf8;box-shadow:0 5px 20px #0002;font-size:13px;opacity:0;pointer-events:none;transition:.25s}.bubble.show{opacity:1}
.hint{position:absolute;z-index:6;left:50%;bottom:18%;transform:translateX(-50%);font-size:11px;color:#fff;background:#0005;padding:5px 9px;border-radius:10px;white-space:nowrap;opacity:.8;transition:.4s}.hint.hide{opacity:0}
.chat{position:absolute;z-index:8;left:10px;right:10px;bottom:10px;display:flex;gap:7px}.chat input{flex:1;border:0;border-radius:18px;padding:12px 14px;background:#fffffff2;font-size:14px;outline:0}.chat button{border:0;border-radius:18px;padding:0 15px;background:#45372e;color:white;font-size:14px}
@media(max-height:620px){.window{height:23%}.catWrap{transform:translate(-50%,-50%) scale(.84)}.chat{bottom:6px}.hint{bottom:15%}}
</style>
</head>
<body>
<div id="app">
<div class="top"><div class="pill">🐾 پیشی</div><div class="stats">
<div class="pill stat">🍗<span id="hunger">80</span><div class="bar"><div class="fill" id="hf"></div></div></div>
<div class="pill stat">⚡<span id="energy">80</span><div class="bar"><div class="fill" id="ef"></div></div></div>
<div class="pill stat">❤️<span id="happy">70</span><div class="bar"><div class="fill" id="yf"></div></div></div>
<div class="pill stat">🤍<span id="trust">45</span><div class="bar"><div class="fill" id="tf"></div></div></div>
</div></div>
<div class="scene" id="scene">
<div class="wall"></div><div class="floor"></div><div class="window"><div class="sun"></div></div>
<div class="rug"></div><div class="bed"></div><div class="box"></div><div class="bowl"></div><div class="scratch"></div><div class="toy"></div>
<div class="bubble" id="bubble"></div>
<div class="catWrap" id="catWrap"><div class="cat" id="cat">
<div class="tail"></div><div class="body"></div><div class="ear e1"></div><div class="ear e2"></div><div class="head"></div>
<div class="eye eye1"></div><div class="eye eye2"></div><div class="nose"></div>
<div class="whisk w1"></div><div class="whisk w2"></div><div class="whisk w3"></div><div class="whisk w4"></div>
<div class="paw p1"></div><div class="paw p2"></div></div></div>
<div class="hint" id="hint">انگشتت را روی پیشی آرام بکش 🐾</div>
</div>
<div class="chat"><input id="msg" placeholder="با پیشی حرف بزن..." autocomplete="off"><button id="send">ارسال</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const defaults={hunger:80,energy:80,happy:70,trust:45,lastSeen:Date.now(),memory:[],importantMemory:[],petLoad:0,location:"center",lastMood:"calm"};
let s=Object.assign({},defaults,JSON.parse(localStorage.getItem("pishi-state")||"null")||{});
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const sleepHours=()=>Math.max(0,(Date.now()-s.lastSeen)/36e5);
function catchUp(){
 const hrs=sleepHours();
 if(!hrs)return;
 s.hunger=clamp(s.hunger-hrs*2.4); s.energy=clamp(s.energy-(hrs>7?1.8:.35)); s.happy=clamp(s.happy-hrs*.75);
 if(hrs>48){s.happy=clamp(s.happy-8);s.energy=clamp(s.energy-5)}
 if(hrs>1440){s.happy=clamp(s.happy-10);s.energy=clamp(s.energy-7)}
 s.lastSeen=Date.now();
 if(hrs>48)s.returnMood=["distance","food","sleep","happy"][Math.floor(Math.random()*4)];
}
catchUp();
function save(){s.lastSeen=Date.now();localStorage.setItem("pishi-state",JSON.stringify(s))}
function render(){["hunger","energy","happy","trust"].forEach(k=>$(k).textContent=Math.round(s[k]));$("hf").style.width=s.hunger+"%";$("ef").style.width=s.energy+"%";$("yf").style.width=s.happy+"%";$("tf").style.width=s.trust+"%"}
function say(t,ms=2600){$("bubble").textContent=t;$("bubble").classList.add("show");clearTimeout(say.t);say.t=setTimeout(()=>$("bubble").classList.remove("show"),ms)}
function setMode(mode){$("cat").className="cat "+mode}
function mood(){let m="";if(s.energy<22)m+=" sleepy";if(s.petLoad>78)m+=" annoyed";if(s.happy>75)m+=" happy";if(s.energy>45&&s.location!=="sleep")m+=" calm";setMode(m)}
function moveTo(name,x,y,mode="walk",duration=1100){
 s.location=name;$("catWrap").style.left=x+"%";$("catWrap").style.top=y+"%";setMode(mode);clearTimeout(moveTo.t);
 moveTo.t=setTimeout(()=>{mood();},duration);save();
}
function greetReturn(){
 if(!s.returnMood)return;
 if(s.returnMood==="happy"){say("بالاخره اومدی! 🐾");s.happy=clamp(s.happy+5)}
 else if(s.returnMood==="food"){say("میو... اول غذا؟ 😿")}
 else if(s.returnMood==="sleep"){say("خیلی خوابم میاد... 😴")}
 else say("...نگات می‌کنم، بعد میام 🐱");
 s.returnMood=null;save();
}
setTimeout(greetReturn,700);
function detectPart(x,y){
 if(y<34)return "ear";
 if(y<70)return "head";
 if(y>118&&x<88)return "tail";
 if(y>105&&x>68&&x<160)return "belly";
 return "body";
}
function react(type,stroke){
 $("hint").classList.add("hide");
 if(type==="body"){
   if(s.petLoad>80){s.petLoad=0;s.happy=clamp(s.happy-2);say("دیگه بسه... می‌خوام خودم باشم 😾");moveTo("away",68,55);return}
   const gentle=stroke&&stroke.speed<.65&&stroke.dist>18;
   s.happy=clamp(s.happy+(gentle?2:1));s.trust=clamp(s.trust+(gentle&&Math.random()<.65?.45:0));s.petLoad+=gentle?8:15;
   setMode("purr");say(s.petLoad>55?"خرررر... 🐱":"آخ... خوبه 🥰");
 }else if(type==="head"){s.trust=clamp(s.trust+.6);s.happy=clamp(s.happy+1);say("سرم رو آروم... 😽");setMode("happy")}
 else if(type==="ear"){say(s.trust>55?"آروم گوشم... 🐱":"هی! گوشم! 😾");if(s.trust<40)s.happy=clamp(s.happy-1);setMode("alert")}
 else if(type==="belly"){if(s.trust<70){say("نه نه... شکمم نه! 😾");s.happy=clamp(s.happy-2);moveTo("away",67,57)}else{say("فقط یه کوچولو... 🥹");s.happy=clamp(s.happy+1)}}
 else if(type==="tail"){say("دمم رو ول کن! 😾");s.happy=clamp(s.happy-1);moveTo("away",67,57)}
 mood();render();save();
}
let touch=null;
$("scene").addEventListener("pointerdown",e=>{
 const r=$("catWrap").getBoundingClientRect();
 if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
   const x=e.clientX-r.left,y=e.clientY-r.top;touch={x:e.clientX,y:e.clientY,t:Date.now(),part:detectPart(x,y),lastX:e.clientX,lastY:e.clientY,dist:0};
   $("scene").setPointerCapture?.(e.pointerId);
 }
});
$("scene").addEventListener("pointermove",e=>{if(!touch)return;touch.dist+=Math.hypot(e.clientX-touch.lastX,e.clientY-touch.lastY);touch.lastX=e.clientX;touch.lastY=e.clientY});
$("scene").addEventListener("pointerup",e=>{
 if(!touch)return;
 const dt=Math.max(1,Date.now()-touch.t),speed=touch.dist/dt;
 const r=$("catWrap").getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 const part=touch.dist>12?"body":detectPart(x,y);
 react(part,{speed,dist:touch.dist,duration:dt});touch=null;
});
$("scene").addEventListener("pointercancel",()=>touch=null);

function remember(text){
 const important=/فردا|بعداً|قول|وعده|یادم|یادت|ماهی|غذا|اسباب.?بازی|اسمم|اسم تو|دوست دارم|دوستت دارم|تولد/i.test(text);
 if(important){s.importantMemory.push(text);s.importantMemory=s.importantMemory.slice(-20)}
}
async function chat(){
 const input=$("msg"),message=input.value.trim();if(!message)return;input.value="";
 remember(message);say("دارم بهت فکر می‌کنم... 🐱",5000);
 s.memory.push({role:"user",content:message});s.memory=s.memory.slice(-12);
 try{
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,state:{hunger:s.hunger,energy:s.energy,happy:s.happy,trust:s.trust,location:s.location,absenceHours:Math.round(sleepHours()),importantMemory:s.importantMemory},memory:s.memory})});
  const data=await r.json();if(!r.ok)throw new Error(data.error||"chat");
  say(data.reply,5000);s.memory.push({role:"assistant",content:data.reply});s.memory=s.memory.slice(-12);save();
 }catch(e){say("میو... فعلاً صدای من از اینجا رد نمی‌شه 😿")}
}
$("send").onclick=chat;$("msg").addEventListener("keydown",e=>{if(e.key==="Enter")chat()});

function autonomous(){
 // انتخاب رفتار بر اساس نیازهای فعلی، نه قرعه‌کشی کاملاً تصادفی
 const energy=s.energy, hunger=s.hunger, happy=s.happy, trust=s.trust;
 const choices=[
  {id:"food",w:Math.max(0,58-hunger)*0.95},
  {id:"rest",w:Math.max(0,62-energy)*1.05},
  {id:"window",w:13+(100-trust)*.08},
  {id:"box",w:12+(100-trust)*.12+(energy<55?5:0)},
  {id:"scratch",w:10+(happy<45?7:0)},
  {id:"play",w:Math.max(0,energy-25)*.35+Math.max(0,65-happy)*.22+trust*.08},
  {id:"social",w:trust*.18+(happy<55?8:0)},
  {id:"groom",w:12+(energy>65?5:0)},
  {id:"wander",w:9+(100-trust)*.05}
 ];
 const total=choices.reduce((a,b)=>a+b.w,0);
 let pick=Math.random()*total, action=choices[choices.length-1].id;
 for(const item of choices){pick-=item.w;if(pick<=0){action=item.id;break}}
 if(action==="food"){say("میو... فکر کنم وقت غذاست 😿");moveTo("bowl",42,76,"walk");return}
 if(action==="rest"){say("یه جای نرم پیدا کنم... 😴");moveTo("bed",20,69,"walk");setTimeout(()=>setMode("sleep"),1200);return}
 if(action==="window"){moveTo("window",20,38,"walk");say("*کنار پنجره می‌نشیند و بیرون را تماشا می‌کند* 🐱");return}
 if(action==="box"){moveTo("box",72,64,"walk");say("*داخل جعبه می‌خزد و خودش را جمع می‌کند* 📦");if(energy<48)setTimeout(()=>setMode("sleep"),1200);return}
 if(action==="scratch"){moveTo("scratch",42,58,"walk");say("*با پنجه‌هایش اسکرچر را می‌خراشد*");s.happy=clamp(s.happy+1);return}
 if(action==="play"){moveTo("toy",58,70,"walk");say("*با کنجکاوی اسباب‌بازی را تعقیب می‌کند* 🐾");s.energy=clamp(s.energy-3);s.happy=clamp(s.happy+3);return}
 if(action==="social"){if(Math.random()<Math.min(.8,trust/125)){moveTo("center",49,58,"walk");say("*نزدیکت می‌آید و با سرش اطراف دستت را بو می‌کند* 🥹")}else{setMode("alert");say("*نگاهی به تو می‌اندازد، اما فعلاً ترجیح می‌دهد فاصله‌اش را حفظ کند* 😼")}return}
 if(action==="groom"){setMode("purr");say("*با حوصله خودش را تمیز می‌کند*");setTimeout(mood,2200);return}
 moveTo("random",35+Math.random()*35,48+Math.random()*25,"walk");say("*برای کشف گوشه‌ای دیگر راه می‌افتد* 🐈");
}
setInterval(()=>{
 s.hunger=clamp(s.hunger-.035);s.energy=clamp(s.energy-(s.energy<30?-.02:.012));s.happy=clamp(s.happy-(s.hunger<25?.018:.006));
 if(s.petLoad>0)s.petLoad=Math.max(0,s.petLoad-.8);
 if(Math.random()<.012&&s.trust>60)s.happy=clamp(s.happy+1);
 mood();render();save();
},1000);
setInterval(autonomous,8500);
setInterval(()=>{if(Math.random()<.32&&s.energy>35)say(["*آرام پلک می‌زند* 🐱","*گوش‌هایش می‌چرخد*","*یک لحظه به تو نگاه می‌کند*","*دمش را آرام تکان می‌دهد*"][Math.floor(Math.random()*4)])},5200);
setInterval(()=>{if(Math.random()<.22){$("cat").classList.add("blink");setTimeout(()=>$("cat").classList.remove("blink"),180)}},2400);
render();mood();
</script>
</body>
</html>
